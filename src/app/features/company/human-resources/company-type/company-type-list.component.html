<app-page-header
  [title]="'company.companyType.titleFull' | translate"
  [showBreadcrumbs]="true"
  [actions]="headerActions"
  [useGlassCard]="false"
  icon="domain"
  iconGradient="from-primary to-primary"
  titleGradient="from-primary to-primary"
  customClass="-mx-4 md:-mx-6 lg:-mx-8 px-4 md:px-6 lg:px-8 pt-6 pb-2"
>
  <div header-actions class="w-full md:w-64">
    <app-glass-input
      [formControl]="searchControl"
      icon="search"
      [placeholder]="'common.actions.search' | translate"
      [isSearch]="true"
      [customClass]="'h-9 text-sm'"
    >
    </app-glass-input>
  </div>
</app-page-header>

<app-glass-card customClass="flex flex-col flex-1 h-[600px] min-h-0">
  <!-- DataGrid Section -->
  <div class="flex-1 w-full min-h-0 relative bg-white dark:bg-gray-900 mt-4 rounded-lg overflow-hidden">
    @if (service.loading()) {
      <!-- Debug: Entered IF (Loading) block -->
      <div class="absolute inset-0 p-6 overflow-auto">
        <app-skeleton-loader
          type="table"
          [rows]="10"
          [columns]="columns.length || 5"
        ></app-skeleton-loader>
      </div>
    } @else {
      <!-- Debug: Entered ELSE block -->
      <div class="hidden">DEBUG: Loading is FALSE</div>

      <!-- Debug info (hidden in production) -->
      <div class="hidden">
        Data Count: {{ data().length }}
        Columns: {{ columns.length }}
      </div>

      <app-syncfusion-data-grid
        class="h-full block"
        [dataSource]="data()"
        [columns]="columns"
        [actions]="gridActions"
        [customClass]="'border-0'"
        [showToolbar]="true"
        [showColumnMenu]="true"
        [showColumnChooser]="true"
        [pageSettings]="{ pageSize: 10, pageSizes: [10, 20, 50, 100], pageCount: 5 }"
        (rowSelected)="onEdit($event.data)"
        (rowDeleted)="onRowDeleted($event)"
      >
      </app-syncfusion-data-grid>
    }
  </div>
</app-glass-card>

<app-company-type-form
  [isOpen]="showModal"
  [data]="selectedItem"
  (close)="showModal = false"
  (save)="onSaveSuccess()"
>
</app-company-type-form>

<!-- Confirmation Dialog -->
<ejs-dialog
  #confirmDialog
  [(visible)]="confirmDialogVisible"
  [header]="confirmDialogTitle"
  [width]="'400px'"
  [isModal]="true"
  [showCloseIcon]="true"
  [closeOnEscape]="true"
  [animationSettings]="{ effect: 'Zoom', duration: 400, delay: 0 }">
  <ng-template #content>
    <div class="p-4">
      <p class="text-gray-700 dark:text-gray-300">{{ confirmDialogMessage }}</p>
    </div>
  </ng-template>
  <ng-template #footerTemplate>
    <div class="flex justify-end gap-3 p-4">
      <button
        ejs-button
        type="button"
        cssClass="e-outline"
        (click)="onCancelDelete()">
        {{ 'common.actions.cancel' | translate }}
      </button>
      <button
        ejs-button
        type="button"
        cssClass="e-primary e-danger"
        (click)="onConfirmDelete()">
        {{ 'common.actions.delete' | translate }}
      </button>
    </div>
  </ng-template>
</ejs-dialog>
