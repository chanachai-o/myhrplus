<app-page-header
  [title]="'company.companyType.titleFull' | translate"
  [showBreadcrumbs]="true"
  [actions]="headerActions"
  [useGlassCard]="false"
  icon="domain"
  iconGradient="from-primary to-primary"
  titleGradient="from-primary to-primary"
  customClass="-mx-4 md:-mx-6 lg:-mx-8 px-4 md:px-6 lg:px-8 pt-6 pb-2"
>
</app-page-header>

<app-glass-card>
  <!-- Search Section inside Card Header -->
  <div class="pb-4 border-b border-gray-100 dark:border-gray-700 flex justify-end">
    <div class="w-full md:w-72">
      <app-glass-input
        [formControl]="searchControl"
        icon="search"
        [placeholder]="'common.actions.search' | translate"
        [isSearch]="true"
        [customClass]="'h-10 text-sm'"
      >
      </app-glass-input>
    </div>
  </div>

  <!-- DataGrid Section -->
  <div class="flex-1 w-full relative bg-white dark:bg-gray-900 mt-4 rounded-lg overflow-hidden">
    @if (service.loading()) {
      <div class="absolute inset-0 p-6 overflow-auto">
        <app-skeleton-loader
          type="table"
          [rows]="10"
          [columns]="columns.length || 5"
        ></app-skeleton-loader>
      </div>
    } @else {
      <app-syncfusion-data-grid
        class="h-full block"
        [dataSource]="(data$ | async) || []"
        [columns]="columns"
        [actions]="gridActions"
        [allowPaging]="true"
        [allowSorting]="true"
        [allowFiltering]="true"
        [allowExcelExport]="true"
        [customClass]="'border-0'"
        [height]="'100%'"
        [width]="'100%'"
        [showToolbar]="false"
        (rowSelected)="onEdit($event.data)"
      >
      </app-syncfusion-data-grid>
    }
  </div>
</app-glass-card>

<app-company-type-form
  [isOpen]="showModal"
  [data]="selectedItem"
  (close)="showModal = false"
  (save)="onSaveSuccess()"
>
</app-company-type-form>
