<app-modal
  [show]="isOpen"
  [title]="(isEditMode ? 'company.bankCompany.edit' : 'company.bankCompany.add') | translate"
  [useSolidBackground]="true"
  [size]="'lg'"
  (closeEvent)="onClose()"
  (confirmEvent)="onSubmit()">

  <form [formGroup]="form" class="space-y-6">
    <!-- Basic Information Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Bank Code -->
      <div>
        <app-glass-input
          [label]="'company.bankCompany.bankId' | translate"
          formControlName="bankid"
          [required]="true"
          [useFormValidationMessages]="true">
          <app-form-validation-messages
            [control]="form.get('bankid')">
          </app-form-validation-messages>
        </app-glass-input>
      </div>

      <!-- Company Code -->
      <div>
        <app-glass-input
          label="รหัสบริษัท"
          formControlName="companyid"
          [required]="true"
          [readonly]="isEditMode"
          [useFormValidationMessages]="true">
          <app-form-validation-messages
            [control]="form.get('companyid')">
          </app-form-validation-messages>
        </app-glass-input>
      </div>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-200 dark:border-gray-700 my-6"></div>

    <!-- Account Information Section -->
    <div class="space-y-6">
      <!-- Account Name (Thai) -->
      <app-glass-input
        [label]="'company.bankCompany.bankClientThName' | translate"
        formControlName="bank_client_thname">
      </app-glass-input>

      <!-- Account Name (English) -->
      <app-glass-input
        label="ชื่อบัญชี (อังกฤษ)"
        formControlName="bank_client_engname">
      </app-glass-input>

      <!-- Account No -->
      <app-glass-input
        [label]="'company.bankCompany.account' | translate"
        formControlName="account"
        [required]="true"
        [useFormValidationMessages]="true">
        <app-form-validation-messages
          [control]="form.get('account')">
        </app-form-validation-messages>
      </app-glass-input>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-200 dark:border-gray-700 my-6"></div>

    <!-- Contact Information Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Contact Person -->
      <div>
        <app-glass-input
          label="ผู้ติดต่อ"
          formControlName="contact_person">
        </app-glass-input>
      </div>

      <!-- Telephone -->
      <div>
        <app-glass-input
          label="เบอร์โทรศัพท์"
          formControlName="tel">
        </app-glass-input>
      </div>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-200 dark:border-gray-700 my-6"></div>

    <!-- Options Section -->
    <div class="flex flex-wrap gap-6">
      <label class="flex items-center space-x-2 cursor-pointer">
        <input 
          type="checkbox" 
          formControlName="isdefault" 
          class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary focus:ring-2">
        <span class="text-gray-700 dark:text-gray-300 select-none">
          {{ 'company.bankCompany.isDefault' | translate }}
        </span>
      </label>
      
      <label class="flex items-center space-x-2 cursor-pointer">
        <input 
          type="checkbox" 
          formControlName="trans_ats" 
          class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary focus:ring-2">
        <span class="text-gray-700 dark:text-gray-300 select-none">ATS</span>
      </label>
    </div>
  </form>

</app-modal>
