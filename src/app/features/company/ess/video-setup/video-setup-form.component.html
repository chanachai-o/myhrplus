<app-modal [show]="isOpen" [title]="(isEditMode ? 'company.videoSetup.edit' : 'company.videoSetup.add') | translate" [useSolidBackground]="true" [size]="'md'" (closeEvent)="onClose()" (confirmEvent)="onSubmit()">
  <form [formGroup]="form" class="space-y-6">
    <app-glass-input [label]="'company.videoSetup.column.id' | translate" formControlName="videoid" [required]="true" [readonly]="isEditMode" [useFormValidationMessages]="true"></app-glass-input>
    <app-glass-input [label]="'company.videoSetup.column.tdesc' | translate" formControlName="tdesc" [required]="true" [useFormValidationMessages]="true"></app-glass-input>
    <app-glass-input [label]="'company.videoSetup.column.edesc' | translate" formControlName="edesc"></app-glass-input>
  </form>
</app-modal>
