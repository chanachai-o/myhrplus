<app-modal [show]="isOpen" [title]="(isEditMode ? 'company.kpi.edit' : 'company.kpi.add') | translate" [useSolidBackground]="true" [size]="'md'" (closeEvent)="onClose()" (confirmEvent)="onSubmit()">
  <form [formGroup]="form" class="space-y-6">
    <app-glass-input [label]="'company.kpi.column.id' | translate" formControlName="kpiId" [required]="true" [readonly]="isEditMode" [useFormValidationMessages]="true">
      <app-form-validation-messages [control]="form.get('kpiId')" [customMessages]="{ required: 'company.kpi.idRequired' | translate }"></app-form-validation-messages>
    </app-glass-input>
    <app-glass-input [label]="'company.kpi.column.tdesc' | translate" formControlName="tdesc" [required]="true" [useFormValidationMessages]="true"></app-glass-input>
    <app-glass-input [label]="'company.kpi.column.edesc' | translate" formControlName="edesc"></app-glass-input>
  </form>
</app-modal>
