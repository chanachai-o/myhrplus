<div class="login-container min-h-screen flex items-center justify-center p-4 relative">
  <!-- Background Graphics -->
  <div class="login-bg-graphics">
    <div class="bg-gradient-overlay"></div>
    <div class="bg-grid-pattern"></div>
  </div>

  <!-- Header with Back to Landing Button and Language/Theme Controls -->
  <div class="login-header fixed top-0 left-0 right-0 z-50 glass-card border-b border-white/10 p-4">
    <div class="container mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button
          type="button"
          (click)="navigateToLanding()"
          class="back-to-home glass-card px-3 py-2 flex items-center space-x-2 hover:scale-105 transition-transform"
          [attr.aria-label]="'features.auth.login.backToHome' | translate">
          <app-icon name="arrow-left" size="sm"></app-icon>
          <span class="hidden md:inline font-medium">{{ 'features.auth.login.home' | translate }}</span>
        </button>
        <div class="text-3xl">🎥</div>
        <h1 class="text-xl font-bold gradient-text">IVAP Platform</h1>
      </div>
      <div class="flex items-center space-x-3">
        <!-- Language Switcher -->
        <div class="relative" appClickOutside (appClickOutside)="closeLanguageMenu()">
          <app-glass-button
            type="button"
            variant="secondary"
            size="sm"
            (clicked)="toggleLanguageMenu()"
            [ariaLabel]="'layout.header.changeLanguage' | translate"
            [title]="'layout.header.changeLanguage' | translate"
            [attr.aria-expanded]="showLanguageMenu"
            [attr.aria-controls]="'language-menu'"
            customClass="control-button language-button">
            <img [src]="currentLanguage.flagPath" [alt]="currentLanguage.name" class="control-icon w-5 h-5 rounded-sm object-cover" />
          </app-glass-button>

          <!-- Language Dropdown -->
          <app-glass-card
            *ngIf="showLanguageMenu"
            variant="strong"
            padding="p-0"
            customClass="language-dropdown absolute right-0 top-full mt-2 w-48
                         rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 theme-myhr:border-primary/30
                         z-50 overflow-hidden
                         backdrop-blur-xl
                         animate-scale-in
                         [animation-duration:200ms]
                         origin-top-right">
            <div id="language-menu" role="menu" [attr.aria-label]="'layout.header.languageMenuAriaLabel' | translate" class="py-1">
              <button
                *ngFor="let lang of availableLanguages; let i = index"
                type="button"
                role="menuitem"
                (click)="changeLanguage(lang.code)"
                [class.active]="currentLang === lang.code"
                [attr.aria-label]="('layout.header.changeLanguageTo' | translate) + ' ' + lang.name"
                [attr.aria-current]="currentLang === lang.code ? 'true' : 'false'"
                [style.--animation-delay]="(i * 50) + 'ms'"
                class="language-item w-full px-4 py-2.5 text-left flex items-center gap-3
                       hover:bg-gray-50 dark:hover:bg-gray-700 theme-myhr:hover:bg-white/20
                       hover:translate-x-1 hover:scale-[1.02]
                       active:scale-[0.98]
                       transition-all duration-200 ease-out
                       animate-fade-in">
                <img [src]="lang.flagPath" [alt]="lang.name" class="w-5 h-5 rounded-sm object-cover" />
                <span class="flex-1 thai-text text-sm font-medium text-gray-700 dark:text-gray-300 theme-myhr:text-white/90">{{ lang.name }}</span>
                <app-icon *ngIf="currentLang === lang.code" name="check" size="sm" color="text-primary theme-myhr:text-primary"></app-icon>
              </button>
            </div>
          </app-glass-card>
        </div>

        <!-- Theme Toggle -->
        <app-theme-toggle></app-theme-toggle>
      </div>
    </div>
  </div>

  <app-glass-card customClass="max-w-md w-full relative z-10 mt-20">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold bg-gradient-to-r from-primary-500 to-purple-600 bg-clip-text text-transparent mb-2">
        {{ 'features.auth.login.title' | translate }}
      </h1>
      <p class="text-gray-600 dark:text-gray-400">
        {{ 'features.auth.login.subtitle' | translate }}
      </p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Username -->
      <div>
        <app-glass-input
          [label]="'features.auth.login.username' | translate"
          [placeholder]="'features.auth.login.username' | translate"
          type="text"
          formControlName="username"
          [required]="true"
          [useFormValidationMessages]="true"
          [ariaLabel]="'features.auth.login.username' | translate">
          <app-form-validation-messages [control]="loginForm.get('username')"></app-form-validation-messages>
        </app-glass-input>
      </div>

      <!-- Password -->
      <div>
        <app-glass-input
          [label]="'features.auth.login.password' | translate"
          [placeholder]="'features.auth.login.password' | translate"
          type="password"
          formControlName="password"
          [required]="true"
          [useFormValidationMessages]="true"
          [ariaLabel]="'features.auth.login.password' | translate">
          <app-form-validation-messages [control]="loginForm.get('password')"></app-form-validation-messages>
        </app-glass-input>
      </div>

      <!-- Database Selection (if available) -->
      <div *ngIf="dbList.length > 0">
        <app-glass-select
          [label]="'features.auth.login.selectDatabase' | translate"
          [placeholder]="'features.auth.login.selectDatabase' | translate"
          [options]="dbSelectOptions"
          [(ngModel)]="dbSelected"
          [ngModelOptions]="{standalone: true}"
          (ngModelChange)="onDbChangeSelect($event)"
          [ariaLabel]="'features.auth.login.selectDatabase' | translate">
        </app-glass-select>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between">
        <app-glass-checkbox
          [label]="'features.auth.login.rememberMe' | translate"
          [(ngModel)]="rememberMe"
          [ngModelOptions]="{standalone: true}"
          [ariaLabel]="'features.auth.login.rememberMe' | translate">
        </app-glass-checkbox>
        <button
          type="button"
          (click)="onForgotPassword()"
          class="text-sm text-primary hover:underline thai-text"
          [attr.aria-label]="'features.auth.login.forgotPassword' | translate">
          {{ 'features.auth.login.forgotPassword' | translate }}
        </button>
      </div>

      <!-- Error Message -->
      <app-alert
        *ngIf="errorMessage()"
        variant="error"
        [dismissible]="false"
        [title]="'features.auth.login.error.title' | translate"
        [message]="errorMessage()">
      </app-alert>

      <!-- Submit Button -->
      <app-glass-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loginForm.invalid || loading()"
        [attr.aria-label]="'features.auth.login.signIn' | translate"
        [attr.aria-busy]="loading()">
        {{ loading() ? ('features.auth.login.signingIn' | translate) : ('features.auth.login.signIn' | translate) }}
      </app-glass-button>
    </form>

    <!-- Register Button -->
    <div class="mt-6">
      <app-glass-button
        type="button"
        (clicked)="navigateToRegister()"
        variant="secondary"
        [fullWidth]="true"
        [attr.aria-label]="'features.auth.login.createAccount' | translate">
        {{ 'features.auth.login.createAccount' | translate }}
      </app-glass-button>
    </div>
  </app-glass-card>
</div>
