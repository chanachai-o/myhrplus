<div class="syncfusion-data-grid w-full h-full flex flex-col" [ngClass]="[customClass, enableAdaptiveUI ? 'e-bigger' : '']">
  <ejs-grid
    #grid
    class="flex-1 w-full min-h-0 block"
    [id]="'grid'"
    [dataSource]="dataSource"
    [height]="'100%'"
    [width]="'100%'"
    [enableAdaptiveUI]="enableAdaptiveUI"
    [adaptiveUIMode]="adaptiveUIMode"
    [rowRenderingMode]="rowRenderingMode"
    [allowPaging]="allowPaging && hasData"
    [allowSorting]="allowSorting"
    [allowFiltering]="allowFiltering"
    [allowGrouping]="allowGrouping"
    [allowResizing]="allowResizing"
    [allowReordering]="allowReordering"
    [allowSelection]="allowSelection"
    [allowTextWrap]="allowTextWrap"
    [textWrapSettings]="textWrapSettings"
    [allowExcelExport]="allowExcelExport"
    [allowPdfExport]="allowPdfExport"
    [showColumnChooser]="showColumnChooser"
    [showColumnMenu]="showColumnMenu"
    [columnMenuItems]="columnMenuItems"
    [toolbar]="showToolbar ? toolbarItems : []"
    [pageSettings]="pageSettings"
    [filterSettings]="filterSettings"
    [groupSettings]="groupSettings"
    [editSettings]="editSettings"
    [selectionSettings]="selectionSettings"
    [searchSettings]="searchSettings"
    [loadingIndicator]="loadingIndicator"
    [locale]="locale"
    (rowSelected)="rowSelected.emit($event)"
    (rowDeselected)="rowDeselected.emit($event)"
    (dataBound)="onDataBound($event)"
    (actionBegin)="onActionBegin($event)"
    (actionComplete)="onActionComplete($event)"
    (toolbarClick)="onToolbarClick($event)"
    (columnMenuClick)="onColumnMenuClick($event)"
    (detailDataBound)="onDetailDataBound($event)">

    <ng-template #emptyRecordTemplate>
      <div class="h-full w-full flex flex-col items-center justify-center p-8">
        <app-empty-state
          [iconName]="'search'"
          [title]="'common.labels.noData' | translate"
          [description]="'common.labels.noDataDescription' | translate"
          [iconSize]="'lg'"
          class="w-full flex justify-center">
        </app-empty-state>
      </div>
    </ng-template>

    <!-- Debug Template (Temporary) -->
    <!--
    <ng-template #template let-data>
      <div style="background: red; padding: 10px; color: white;">
        ROW RENDERED: {{ data | json }}
      </div>
    </ng-template>
    -->

    <e-columns>
      <!-- Dynamic Columns -->
      <ng-container *ngFor="let col of columns">
        <e-column
          [field]="col.field"
          [headerText]="col.headerText | translate"
          [width]="col.width"
          [textAlign]="col.textAlign || 'Left'"
          [format]="col.format"
          [type]="col.type === 'date' || col.type === 'datetime' ? 'date' : (col.type === 'boolean' ? 'boolean' : 'string')"
          [isPrimaryKey]="col.isPrimaryKey"
          [visible]="col.visible !== false"
          [allowSorting]="col.allowSorting !== false"
          [allowFiltering]="col.allowFiltering !== false"
          [allowGrouping]="col.allowGrouping !== false"
          [showInColumnChooser]="col.showInColumnChooser !== false">

          <!-- DEBUG: Simple text template to force rendering -->
          <!--
          <ng-template #template let-data>
             <span>{{ data[col.field] }}</span>
          </ng-template>
          -->

          <!-- Default Template for String/Number/Date (Forces rendering) -->
          <!--
          <ng-template #template let-data *ngIf="!col.type || col.type === 'string' || col.type === 'number' || col.type === 'date'">
            {{ getDataValue(data, col.field) }}
          </ng-template>
          -->

          <!-- Template for Badge -->
          <ng-template #template let-data *ngIf="col.type === 'badge'">
            <ng-container *ngIf="getBadgeConfig(col, getDataValue(data, col.field)) as badge">
              <span class="badge" [ngClass]="badge.class">
                <i *ngIf="badge.icon" [class]="badge.icon"></i>
                {{ badge.label | translate }}
              </span>
            </ng-container>
            <ng-container *ngIf="!getBadgeConfig(col, getDataValue(data, col.field))">
              {{ getDataValue(data, col.field) }}
            </ng-container>
          </ng-template>

          <!-- Template for Image -->
          <ng-template #template let-data *ngIf="col.type === 'image'">
             <div class="flex items-center justify-center">
               <img [src]="getDataValue(data, col.field) || './assets/img/users/defaultperson.jpg'"
                    class="h-10 w-10 rounded-full object-cover border border-gray-200"
                    alt="Image">
             </div>
          </ng-template>

          <!-- Primary key: แสดงขีดเส้นใต้ ให้รู้ว่ากดแถวเพื่อ edit ได้ -->
          <ng-template #template let-data *ngIf="col.isPrimaryKey && col.type !== 'badge' && col.type !== 'image'">
            <span class="primary-key-cell text-primary">{{ getDataValue(data, col.field) }}</span>
          </ng-template>

        </e-column>
      </ng-container>

      <!-- Actions Column (freeze ขวาได้เมื่อ freezeActionsColumn = true) -->
      <e-column
        *ngIf="actions.length > 0"
        [headerText]="actionHeaderText | translate"
        [width]="actionWidth"
        textAlign="Center"
        freeze='Right'
        [allowSorting]="false"
        [allowFiltering]="false"
        [allowGrouping]="false"
        [showInColumnChooser]="false">
        <ng-template #template let-data>
          <div class="flex items-center justify-center gap-2">
            <ng-container *ngFor="let action of actions">
              <button
                *ngIf="!action.visible || action.visible(data)"
                type="button"
                [title]="action.title | translate"
                class="btn-icon p-1 rounded-full transition-colors duration-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                [ngClass]="action.class || ''"
                (click)="$event.stopPropagation(); onActionClick(action, data)">
                <i *ngIf="action.icon" [class]="action.icon"></i>
                <span *ngIf="!action.icon && action.label">{{ action.label | translate }}</span>
              </button>
            </ng-container>
          </div>
        </ng-template>
      </e-column>

    </e-columns>

    <!-- Aggregates: เมื่อเพิ่ม aggregate คอลัมน์ที่สอง aggregateRenderKey เปลี่ยน → e-aggregate ถูกสร้างใหม่ → Syncfusion อ่านทุกคอลัมน์ -->
    <e-aggregates>
      <e-aggregate *ngFor="let aggKey of allAggregateColumns.length ? [aggregateRenderKey] : []; trackBy: trackByAggKey">
        <e-columns>
          <e-column *ngFor="let ag of allAggregateColumns; trackBy: trackByAggField" [field]="ag.field" [type]="ag.type" [footerTemplate]="ag.footerTemplate"></e-column>
        </e-columns>
      </e-aggregate>
    </e-aggregates>

  </ejs-grid>
</div>
