<div
  *ngIf="show"
  class="fixed inset-0 z-50 overflow-y-auto"
  role="dialog"
  [attr.aria-modal]="true"
  [attr.aria-labelledby]="modalTitleId"
  [attr.aria-describedby]="modalDescriptionId"
  (click)="onBackdropClick()">
  <div class="flex min-h-screen items-start justify-center px-4 pt-24 pb-20 text-center sm:p-0">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm animate-fade-in motion-safe:animate-none" ></div>

    <!-- Modal Panel -->
    <!-- Added mt-24 for desktop spacing, kept mx-auto -->
    <div
      #modalPanel
      class="relative w-full transform overflow-hidden rounded-2xl text-left shadow-xl transition-all sm:my-8 sm:mt-24 sm:max-w-lg animate-slide-down motion-safe:animate-none"
      [ngClass]="{
        'glass-strong dark:glass-dark-strong theme-myhr:glass-myhr-strong theme-myhr:shadow-myhr-lg': !useSolidBackground,
        'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700': useSolidBackground
      }"
      [class]="sizeClass"
      role="document"
      (click)="$event.stopPropagation()">
      <!-- Header -->
      <div
        class="px-6 py-4 border-b flex items-center justify-between"
        [ngClass]="{
          'border-slate-200 dark:border-slate-700': !useSolidBackground,
          'bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700': useSolidBackground
        }">
        <h3 [id]="modalTitleId" class="text-lg font-semibold text-slate-900 dark:text-slate-100">
          {{ title | translate }}
        </h3>
        <button
          *ngIf="closable"
          type="button"
          #closeButton
          (click)="close()"
          (keydown.enter)="close()"
          (keydown.space)="close(); $event.preventDefault()"
          [attr.aria-label]="closeAriaLabel"
          class="min-h-[44px] min-w-[44px] flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 rounded-md transition-colors">
          <span >✕</span>
        </button>
      </div>

      <!-- Body -->
      <div
        [id]="modalDescriptionId"
        class="px-6 py-6"
        [ngClass]="{
          'bg-transparent': !useSolidBackground,
          'bg-white dark:bg-gray-800': useSolidBackground
        }">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div
        *ngIf="showFooter"
        class="px-6 py-4 border-t flex justify-end space-x-3"
        [ngClass]="{
          'border-slate-200 dark:border-slate-700': !useSolidBackground,
          'bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700': useSolidBackground
        }">
        <app-glass-button
          *ngIf="showCancel"
          variant="secondary"
          [ariaLabel]="displayCancelText"
          (clicked)="onCancel()">
          {{ displayCancelText }}
        </app-glass-button>
        <app-glass-button
          *ngIf="showConfirm"
          [variant]="confirmVariant"
          [ariaLabel]="displayConfirmText"
          (clicked)="onConfirm()">
          {{ displayConfirmText }}
        </app-glass-button>
      </div>
    </div>
  </div>
</div>
