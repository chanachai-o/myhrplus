<div class="w-full fade-in motion-safe:animate-none" [ngClass]="['skeleton-' + type, 'animate-' + animation]">
  <!-- Text Skeleton -->
  <ng-container *ngIf="type === 'text'">
    <div *ngFor="let row of getRowsArray(); let i = index" 
         class="h-4 mb-3 last:mb-0 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"
         [style.width]="getRandomWidth(i)"></div>
  </ng-container>

  <!-- Card Skeleton -->
  <ng-container *ngIf="type === 'card'">
    <div class="p-6 rounded-lg glass-weak dark:glass-dark-weak theme-myhr:glass-myhr-weak">
      <div class="flex items-center gap-4 mb-4" *ngIf="showTitle">
        <div class="w-10 h-10 rounded-full flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20" *ngIf="showAvatar"></div>
        <div class="h-5 w-3/5 mb-2 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
      </div>
      <div class="flex flex-col gap-2">
        <div *ngFor="let row of getRowsArray(); let i = index" 
             class="h-4 mb-3 last:mb-0 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"
             [style.width]="getRandomWidth(i)"></div>
      </div>
    </div>
  </ng-container>

  <!-- Table Skeleton -->
  <ng-container *ngIf="type === 'table'">
    <div class="w-full rounded-lg overflow-hidden glass-weak dark:glass-dark-weak theme-myhr:glass-myhr-weak">
      <div class="grid gap-4 p-4 glass-weak dark:glass-dark-weak border-b border-slate-200/20 dark:border-slate-700/20" 
           [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'">
        <div *ngFor="let col of getColumnsArray()" 
             class="h-4 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
      </div>
      <div *ngFor="let row of getRowsArray()" 
           class="grid gap-4 p-4 border-b border-slate-200/10 dark:border-slate-700/10 last:border-b-0"
           [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'">
        <div *ngFor="let col of getColumnsArray()" 
             class="h-4 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
      </div>
    </div>
  </ng-container>

  <!-- DataGrid Skeleton (Syncfusion DataGrid) -->
  <ng-container *ngIf="type === 'datagrid'">
    <div class="w-full h-full flex flex-col bg-white dark:bg-gray-900 rounded-lg overflow-hidden">
      <!-- Toolbar Skeleton -->
      <div *ngIf="showToolbar" class="flex items-center justify-between gap-2 p-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
        </div>
        <div class="flex items-center gap-2">
          <div class="h-8 w-20 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-20 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
        </div>
      </div>

      <!-- Header Row Skeleton -->
      <div class="grid gap-0 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800" 
           [style.grid-template-columns]="'repeat(' + (columns + (hasActions ? 1 : 0)) + ', minmax(0, 1fr))'">
        <div *ngFor="let col of getColumnsArray()" 
             class="h-12 px-4 flex items-center border-r border-gray-200 dark:border-gray-700 last:border-r-0">
          <div class="h-4 w-24 rounded bg-gradient-to-r from-slate-300 via-slate-200 to-slate-300 bg-[length:200%_100%] dark:from-slate-600 dark:via-slate-500 dark:to-slate-600 theme-myhr:from-primary/30 theme-myhr:via-primary/40 theme-myhr:to-primary/30"></div>
        </div>
        <div *ngIf="hasActions" 
             class="h-12 px-4 flex items-center justify-center border-r border-gray-200 dark:border-gray-700 last:border-r-0">
          <div class="h-4 w-16 rounded bg-gradient-to-r from-slate-300 via-slate-200 to-slate-300 bg-[length:200%_100%] dark:from-slate-600 dark:via-slate-500 dark:to-slate-600 theme-myhr:from-primary/30 theme-myhr:via-primary/40 theme-myhr:to-primary/30"></div>
        </div>
      </div>

      <!-- Data Rows Skeleton -->
      <div class="flex-1 overflow-auto">
        <div *ngFor="let row of getRowsArray(); let rowIndex = index" 
             class="grid gap-0 border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors"
             [style.grid-template-columns]="'repeat(' + (columns + (hasActions ? 1 : 0)) + ', minmax(0, 1fr))'">
          <div *ngFor="let col of getColumnsArray(); let colIndex = index" 
               class="h-12 px-4 flex items-center border-r border-gray-100 dark:border-gray-800 last:border-r-0">
            <div class="h-4 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"
                 [style.width]="getRandomWidth(rowIndex, colIndex)"></div>
          </div>
          <div *ngIf="hasActions" 
               class="h-12 px-4 flex items-center justify-center gap-2 border-r border-gray-100 dark:border-gray-800 last:border-r-0">
            <div class="h-6 w-6 rounded-full bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
            <div class="h-6 w-6 rounded-full bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          </div>
        </div>
      </div>

      <!-- Pagination Skeleton -->
      <div *ngIf="showPagination" class="flex items-center justify-between gap-4 p-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <div class="flex items-center gap-2">
          <div class="h-6 w-20 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-6 w-32 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
        </div>
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
          <div class="h-8 w-8 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- List Skeleton -->
  <ng-container *ngIf="type === 'list'">
    <div *ngFor="let listItem of getRowsArray(); let itemIndex = index" 
         class="flex items-center gap-4 p-4 border-b border-slate-200/10 dark:border-slate-700/10 last:border-b-0">
      <div class="w-10 h-10 rounded-full flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20" *ngIf="showAvatar"></div>
      <div class="flex-1 flex flex-col gap-2">
        <div class="h-5 w-3/5 mb-2 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
        <div *ngFor="let row of getRowsArray(); let rowIndex = index" 
             class="h-4 mb-3 last:mb-0 rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20" 
             [style.width]="getRandomWidth(rowIndex, itemIndex)"></div>
      </div>
    </div>
  </ng-container>

  <!-- Avatar Skeleton -->
  <ng-container *ngIf="type === 'avatar'">
    <div class="w-10 h-10 rounded-full flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20"></div>
  </ng-container>

  <!-- Custom Skeleton -->
  <ng-container *ngIf="type === 'custom'">
    <div class="rounded bg-gradient-to-r from-slate-200 via-slate-100 to-slate-200 bg-[length:200%_100%] dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 theme-myhr:from-primary/20 theme-myhr:via-primary/30 theme-myhr:to-primary/20" 
         [style.width]="width" 
         [style.height]="height"></div>
  </ng-container>
</div>
