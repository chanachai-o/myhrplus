<header class="w-full h-14 bg-primary theme-myhr:bg-primary text-white flex items-center px-3 md:px-4 shadow-md z-50 relative justify-between transition-colors duration-300">
  <!-- Left: App Launcher + Logo -->
  <div class="flex items-center gap-3 md:gap-4">
    <!-- Menu Toggle (Visible on Mobile & Desktop) -->
    <button type="button"
            class="p-2 rounded-lg hover:bg-white/10 text-white transition-colors"
            (mousedown)="$event.stopPropagation()"
            (touchstart)="$event.stopPropagation()"
            (click)="$event.stopPropagation(); toggleSidenav.emit()"
            [attr.aria-label]="'layout.header.menu' | translate">
      <app-icon name="menu" size="md" color="text-white"></app-icon>
    </button>

    <!-- App Launcher (Desktop only - Cosmetic) -->


    <!-- App Logo / Name -->
    <a routerLink="/home" class="flex items-center gap-2 hover:opacity-90 transition-opacity group">
       <!-- Logo Image -->
       <img [src]="'assets/images/logo/logo-myhr-light.png'" [alt]="'layout.header.appLogo' | translate" class="h-8 md:h-9 w-auto object-contain transition-transform duration-300 group-hover:scale-105" />

    </a>
  </div>

  <!-- Center: Omni-Search -->
  <div class="flex-1 max-w-2xl px-4 hidden md:flex justify-center">
    <button
      type="button"
      (click)="openOmniSearch()"
      [attr.aria-label]="'layout.header.searchMenuAriaLabel' | translate"
      class="w-full max-w-md h-9 px-4 rounded-md
             bg-white/20 hover:bg-white/30
             border border-white/10
             text-left flex items-center gap-3
             transition-all duration-200
             focus:outline-none focus:ring-2 focus:ring-white/30
             group">
      <app-icon name="search" size="sm" color="text-white/80 group-hover:text-white transition-colors"></app-icon>
      <span class="flex-1 text-sm text-white/80 group-hover:text-white transition-colors">
        {{ 'layout.header.searchMenuPlaceholder' | translate }}
      </span>
      <kbd class="hidden lg:inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium
                  bg-black/20 text-white/70 rounded border border-white/10">
        <span>Ctrl</span><span>K</span>
      </kbd>
    </button>
  </div>

  <!-- Right: Actions -->
  <div class="flex items-center gap-1 md:gap-2 ml-auto">
    <!-- Search Toggle (Mobile) -->
    <button type="button"
            class="md:hidden p-2 rounded-lg hover:bg-white/10 text-white transition-colors"
            (click)="openOmniSearch()">
      <app-icon name="search" size="md" color="text-white"></app-icon>
    </button>

    <!-- Language Switcher -->
    <div class="relative" appClickOutside (appClickOutside)="closeLanguageMenu()">
      <button type="button"
              class="p-2 h-9 min-w-[36px] flex items-center justify-center rounded-md hover:bg-white/10 transition-colors"
              (click)="toggleLanguageMenu()"
              [attr.aria-label]="'layout.header.changeLanguage' | translate">
        <img [src]="getFlagPath(currentLanguage)"
             [alt]="currentLanguage"
             class="w-6 h-6 object-cover rounded-full shadow-sm"
             onerror="this.src='assets/images/flags/gb.svg'" />
      </button>

      <!-- Language Dropdown -->
      <div *ngIf="showLanguageMenu"
           class="absolute right-0 top-full mt-2 w-48
                  rounded-xl shadow-xl
                  bg-white dark:bg-gray-800
                  border border-gray-200 dark:border-gray-700
                  z-50 overflow-hidden
                  animate-scale-in origin-top-right">
        <div class="py-1">
          <button *ngFor="let lang of languages"
                  type="button"
                  (click)="changeLanguage(lang.value)"
                  class="w-full px-4 py-3 text-left flex items-center gap-3
                         hover:bg-gray-50 dark:hover:bg-gray-700
                         transition-colors duration-200">
             <img [src]="lang.flagPath" class="w-5 h-5 object-cover rounded-full">
             <span class="text-sm font-medium text-gray-700 dark:text-gray-200">{{ lang.label }}</span>
             <app-icon *ngIf="currentLanguage === lang.value" name="check" size="sm" color="text-primary"></app-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Theme Toggle -->
    <app-theme-toggle
      customClass="p-2 rounded-lg hover:bg-white/10 text-white transition-colors !bg-transparent !border-none !shadow-none !w-auto !h-auto !min-w-[unset] !min-h-[unset] !px-2 !py-2"
      iconColor="text-white group-hover:rotate-12 transition-transform duration-300">
    </app-theme-toggle>

    <!-- Notifications -->
    <div class="relative" appClickOutside (appClickOutside)="closeNotificationMenu()">
       <button type="button"
               class="p-2 rounded-lg hover:bg-white/10 text-white transition-colors relative"
               (click)="toggleNotificationMenu()"
               [attr.aria-label]="'layout.header.notifications' | translate">
         <app-icon name="notifications" size="md" color="text-white"></app-icon>
         <span *ngIf="unreadCount > 0"
               class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-primary"></span>
       </button>

       <!-- Notification Dropdown (Same as before but standard colors) -->
       <app-glass-card *ngIf="showNotificationMenu"
         variant="strong"
         padding="p-0"
         customClass="absolute right-0 top-full mt-2 w-80 md:w-96 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 max-h-96 overflow-hidden flex flex-col bg-white dark:bg-gray-900 origin-top-right animate-scale-in">
          <!-- ... Reuse existing notification content structure but simplify colors ... -->
          <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
             <h3 class="font-semibold text-gray-800 dark:text-white">{{ 'layout.header.notifications' | translate }}</h3>
             <button *ngIf="unreadCount > 0" (click)="markAllAsRead()" class="text-xs text-primary font-medium hover:underline">{{ 'layout.header.markAllAsRead' | translate }}</button>
          </div>
          <div class="overflow-y-auto flex-1 max-h-[300px]">
             <div *ngIf="notifications.length === 0" class="p-8 text-center text-gray-500">
                <app-icon name="notifications_none" size="xl" class="mb-2 block mx-auto opacity-50"></app-icon>
                <p class="text-sm">{{ 'layout.header.noNotifications' | translate }}</p>
             </div>
             <div *ngFor="let notification of notifications"
                  (click)="handleNotificationClick(notification)"
                  class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-colors"
                  [class.bg-blue-50]="!notification.read"
                  [class.dark:bg-blue-900_10]="!notification.read">
                  <div class="flex gap-3">
                     <app-icon [name]="getNotificationIconName(notification.type)" [color]="getNotificationIconColor(notification.type)"></app-icon>
                     <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">{{ notification.title }}</p>
                        <p class="text-xs text-gray-600 dark:text-gray-400 line-clamp-2">{{ notification.message }}</p>
                        <p class="text-xs text-gray-400 mt-1">{{ getTimeAgo(notification.timestamp) }}</p>
                     </div>
                  </div>
             </div>
          </div>
       </app-glass-card>
    </div>

    <!-- User Profile -->
    <div class="relative ml-1" appClickOutside (appClickOutside)="closeUserMenu()" *ngIf="currentUser">
       <button type="button"
               (click)="toggleUserMenu()"
               class="flex items-center gap-2 pl-2 pr-1 py-1 rounded-full hover:bg-white/10 transition-colors border border-transparent hover:border-white/10">
          <app-avatar [src]="getAvatarUrl() || ''" [name]="getUserDisplayName()" size="xs" status="online" shape="circle"
                      class=""></app-avatar>
          <span class="hidden lg:block text-sm font-medium text-white whitespace-nowrap">{{ getUserDisplayName() }}</span>
          <app-icon name="expand_more" size="sm" color="text-white/70"></app-icon>
       </button>

       <!-- User Dropdown -->
       <app-glass-card *ngIf="showUserMenu"
          variant="strong"
          padding="p-0"
          customClass="absolute right-0 top-full mt-2 w-72 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden bg-white dark:bg-gray-900 origin-top-right animate-scale-in">
          <!-- ... Reuse user menu structure ... -->
          <div class="px-4 py-4 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
             <div class="flex items-center gap-3">
                <app-avatar [src]="getAvatarUrl() || ''" [name]="getUserDisplayName()" size="md" shape="circle"></app-avatar>
                <div class="min-w-0">
                   <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">{{ getUserDisplayName() }}</p>
                   <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ getUserRole() }}</p>
                </div>
             </div>
          </div>
          <div class="py-1">
             <button (click)="onProfile()" class="w-full px-4 py-2.5 text-left flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm">
                <app-icon name="person" size="sm"></app-icon> {{ 'layout.header.profile' | translate }}
             </button>
             <button (click)="onPreferences()" class="w-full px-4 py-2.5 text-left flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm">
                <app-icon name="settings" size="sm"></app-icon> {{ 'layout.header.settings' | translate }}
             </button>
             <div class="border-t border-gray-100 dark:border-gray-700 my-1"></div>
             <button (click)="onLogout()" class="w-full px-4 py-2.5 text-left flex items-center gap-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 text-sm">
                <app-icon name="logout" size="sm"></app-icon> {{ 'layout.header.logout' | translate }}
             </button>
          </div>
       </app-glass-card>
    </div>
  </div>

  <!-- Omni-Search Component (Hidden) -->
  <app-omni-search #omniSearch (resultSelected)="onOmniSearchResult($event)"></app-omni-search>
</header>
