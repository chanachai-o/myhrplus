<footer class="myhr-footer h-[30px] min-h-[30px] flex items-center
  bg-white/80 dark:bg-gray-900/80 theme-myhr:bg-gray-900/40
  backdrop-blur-md border-t border-gray-200/60 dark:border-gray-700/40 theme-myhr:border-primary/30
  shadow-[0_-1px_3px_rgba(0,0,0,0.04)] dark:shadow-none theme-myhr:shadow-[0_-2px_8px_rgba(var(--primary-rgb),0.15)]
  transition-colors duration-300">
  <div class="footer-content flex flex-row justify-between items-center gap-2 px-3 w-full max-w-[1400px] mx-auto h-full text-[10px]">
    <div class="flex items-center gap-1.5 min-w-0">
      <span class="thai-text text-[10px] font-medium truncate
        text-gray-600 dark:text-gray-400 theme-myhr:text-white/90
        transition-colors duration-300">
        &copy; {{ currentYear }} {{ appName }}
      </span>
      <span class="hidden sm:inline text-[10px] truncate
        text-gray-500 dark:text-gray-500 theme-myhr:text-white/75
        transition-colors duration-300">
        {{ 'layout.footer.copyright' | translate }}
      </span>
    </div>
    <div class="flex items-center flex-shrink-0">
      <span class="text-[10px] font-mono tabular-nums
        text-gray-500 dark:text-gray-500 theme-myhr:text-white/75
        transition-colors duration-300">
        v{{ version }}
      </span>
    </div>
  </div>
</footer>
