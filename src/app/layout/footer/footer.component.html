<footer class="glass-nav !bg-white/20 dark:!bg-gray-900/20 theme-myhr:!bg-gray-900/30 !backdrop-blur-lg border-t border-white/30 dark:border-gray-700/30 theme-myhr:border-primary/30 shadow-glass-sm transition-all duration-300 myhr-footer">
  <div class="footer-content flex flex-col sm:flex-row justify-between items-center gap-1.5 sm:gap-3 px-4 md:px-6 py-2 md:py-2.5 w-full mx-auto h-full">
    <div class="flex items-center gap-2">
      <span class="thai-text text-xs md:text-sm text-gray-600 dark:text-gray-400 theme-myhr:text-white/80 transition-colors duration-300">
        &copy; {{ currentYear }} {{ appName }}
      </span>
      <span class="hidden sm:inline text-xs md:text-sm text-gray-500 dark:text-gray-500 theme-myhr:text-white/70 transition-colors duration-300">
        {{ 'layout.footer.copyright' | translate }}
      </span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs md:text-sm text-gray-500 dark:text-gray-500 theme-myhr:text-white/70 font-mono transition-colors duration-300">
        v{{ version }}
      </span>
    </div>
  </div>
</footer>
